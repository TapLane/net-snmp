on:
  push:
    branches: [master]

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout net-snmp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine ARM64
        uses: addnab/docker-run-action@v3
        with:
          image: alpine:3.19
          options: --platform linux/arm64 -v ${{ github.workspace }}:/work
          run: |
            apk update
            apk add --no-cache git build-base perl-dev openssl-dev \
              python3-dev py3-setuptools linux-headers autoconf automake libtool
            
            cd /work
            ./configure --with-defaults --with-python-modules --enable-shared
            make -j$(nproc)
            make DESTDIR=$(pwd)/.dist install

      - name: Commit and Push
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Force add .dist in case it's ignored
          git add -f .dist/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: build arm64 alpine binaries [skip ci]"
            git push origin master
          fi