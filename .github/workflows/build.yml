on:
  push:
    branches: [master]

jobs:
  build-and-commit-amd-platform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout net-snmp
        uses: actions/checkout@v4
        with:
          repository: TapLane/net-snmp
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine AMD64
        uses: addnab/docker-run-action@v3
        with:
          image: node:24.3.0-alpine
          options: --platform linux/amd64 -v ${{ github.workspace }}:/work
          run: |
            apk update
            apk add --no-cache \
              build-base \
              perl \
              perl-dev \
              py3-setuptools \
              openssh \
              openssl-dev \
              libffi-dev \
              nmap \
              nmap-scripts \
              wget \
              libc-utils \
              autoconf \
              automake \
              python3-dev \
              linux-headers
              
            cd /work
            ./configure --with-python-modules --libdir=/usr/lib --enable-shared --enable-blumenthal-aes
            make -j$(nproc)
            make DESTDIR=$(pwd)/.dist/amd64 install
            cd python
            python3 setup.py install --root=$(pwd)/../.dist/amd64 --prefix=/usr/local
      
      - name: Commit and Push
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Force add .dist in case it's ignored
          git add -f .dist/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: build arm64 alpine binaries [skip ci]"
            git push origin master
          fi

  build-and-commit-arm-platform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout net-snmp
        uses: actions/checkout@v4
        with:
          repository: TapLane/net-snmp
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine ARM64
        uses: addnab/docker-run-action@v3
        with:
          image: node:24.3.0-alpine
          options: --platform linux/arm64 -v ${{ github.workspace }}:/work
          run: |
            apk update
            apk add --no-cache \
              build-base \
              perl \
              perl-dev \
              py3-setuptools \
              openssh \
              openssl-dev \
              libffi-dev \
              nmap \
              nmap-scripts \
              wget \
              libc-utils \
              autoconf \
              automake \
              python3-dev \
              linux-headers
              
            cd /work
            ./configure --with-python-modules --libdir=/usr/lib --enable-shared --enable-blumenthal-aes
            make -j$(nproc)
            make DESTDIR=$(pwd)/.dist/arm64 install
            cd python
            python3 setup.py install --root=$(pwd)/../.dist/arm64 --prefix=/usr/local

      - name: Commit and Push
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Force add .dist in case it's ignored
          git add -f .dist/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: build arm64 alpine binaries [skip ci]"
            git push origin master
          fi