on:
  push:
    branches: [master]

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout net-snmp
        uses: actions/checkout@v4
        with:
          repository: TapLane/net-snmp
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine ${{ matrix.arch }}
        uses: addnab/docker-run-action@v3
        with:
          image: node:24.3.0-alpine
          options: --platform linux/${{ matrix.arch }} -v ${{ github.workspace }}:/work
          run: |
            apk update
            apk add --no-cache \
              build-base \
              perl \
              perl-dev \
              py3-setuptools \
              openssh \
              openssl-dev \
              libffi-dev \
              nmap \
              nmap-scripts \
              wget \
              libc-utils \
              autoconf \
              automake \
              python3-dev \
              linux-headers
              
            cd /work
            ./configure --with-python-modules --libdir=/usr/lib --enable-shared --enable-blumenthal-aes
            make -j$(nproc)
            make DESTDIR=$(pwd)/.dist/${{ matrix.arch }} install
            cd python
            python3 setup.py install --root=$(pwd)/../.dist/${{ matrix.arch }} --prefix=/usr/local

      - name: Archive Binaries
        run: |
          cd .dist/${{ matrix.arch }}
          tar -cvf ../../net-snmp-${{ matrix.arch }}.tar .
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: net-snmp-${{ matrix.arch }}.tar

  commit-all:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .dist/
          pattern: binaries-*
          merge-multiple: true

      - name: Extract and Organize
        run: |
          mkdir -p .dist/amd64 .dist/arm64
          
          AMD_TAR=$(find .temp_artifacts -name "net-snmp-amd64.tar")
          
          tar -xvf "$AMD_TAR" -C .dist/amd64/
          
          rm -rf .temp_artifacts/

      - name: Commit and Push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # This adds both .dist/amd64 and .dist/arm64
          git add -f .dist/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: build multi-arch binaries [skip ci]"
            git push origin master
          fi